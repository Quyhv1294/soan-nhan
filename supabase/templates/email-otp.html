<!doctype html>
<html lang="vi">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;padding:24px;background:#fafaf6;font-family:Arial,sans-serif;color:#1d2433">
    <table role="presentation" style="width:100%;max-width:520px;margin:auto;border:1px solid #e3e3dc;border-radius:16px;background:#ffffff">
      <tr><td style="padding:28px">
        <h1 style="margin:0 0 16px;font-size:24px">Mã đăng nhập Soạn Nhàn</h1>
        <p style="font-size:16px;line-height:1.6">Cô nhập mã dưới đây vào ô Mã OTP trên website để đăng nhập:</p>
        <p style="padding:20px 12px;border-radius:8px;background:#e6efe9;color:#1e4b3a;font-family:monospace;font-size:32px;font-weight:bold;letter-spacing:6px;text-align:center">{{ .Token }}</p>
        <p style="font-size:14px;line-height:1.6">Mã dùng một lần. Nếu mã hết hạn, cô yêu cầu mã mới trên màn hình đăng nhập.</p>
        <p style="font-size:14px;line-height:1.6;color:#5b6475">Nếu không yêu cầu đăng nhập, cô có thể bỏ qua email này. Giữ riêng mã xác nhận của mình.</p>
      </td></tr>
    </table>
  </body>
</html>
